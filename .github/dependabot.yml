version: 2
updates:
  # Monitor Docker base images
  - package-ecosystem: "docker"
    directory: "/dev-container-node"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
  - package-ecosystem: "docker"
    directory: "/velocity"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
  - package-ecosystem: "docker"
    directory: "/paper"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"

  - package-ecosystem: "docker"
    directory: "/keycloak"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
  - package-ecosystem: "docker"
    directory: "/minestom-lobby"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      github-actions-all:
        patterns:
          - "*"
