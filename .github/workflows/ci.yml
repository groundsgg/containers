name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  player-access-privacy-tests:
    name: Player access privacy in pinned proxy runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: python3 scripts/test-player-access-privacy.py
      - run: python3 scripts/test-transfer-admission-build.py

  startup-contract-tests:
    name: Container startup contracts
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: Test Paper startup modes
        run: scripts/test-paper-start.sh

      - name: Test Velocity Floodgate startup
        run: scripts/test-velocity-floodgate-start.sh

      - name: Set up Java for the buildserver restore
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Test buildserver working-copy restore
        run: scripts/test-buildserver-restore.sh

  docker-build:
    name: 🐳 Build ${{ matrix.container }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        container:
          - dev-container-node
          - velocity
          - paper
          - paper-gamemode
          - keycloak
          - geyser
          - plugin-floodgate
          - buildserver
          - crafatar
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Detect changes
        uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files: |
            ${{ matrix.container }}/**
            ${{ matrix.container == 'buildserver' && 'scripts/test-buildserver-scene-editor-pin.sh' || '' }}
            ${{ (matrix.container == 'velocity' || matrix.container == 'geyser') && 'scripts/player-access-privacy/**' || '' }}
            ${{ matrix.container == 'velocity' && 'scripts/transfer-admission/**' || '' }}
      - name: 🐳 Set up Docker Buildx
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: 🔨 Build Docker image
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.container }}/Dockerfile
          push: false
          load: ${{ matrix.container == 'buildserver' }}
          tags: ${{ matrix.container == 'buildserver' && 'grounds-buildserver:ci-test' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ (matrix.container == 'buildserver' || matrix.container == 'crafatar') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.event.repository.updated_at }}
            VCS_REVISION=${{ github.sha }}
            IMAGE_VERSION=ci-test
          secrets: |
            github_token=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🔍 Smoke test buildserver Scene Editor pin
        if: steps.changed-files.outputs.any_changed == 'true' && matrix.container == 'buildserver'
        run: scripts/test-buildserver-scene-editor-pin.sh grounds-buildserver:ci-test

      - name: 🔨 Build Keycloak smoke-test image
        if: steps.changed-files.outputs.any_changed == 'true' && matrix.container == 'keycloak'
        run: |
          docker buildx build \
            --file keycloak/Dockerfile \
            --load \
            --platform linux/amd64 \
            --tag grounds-keycloak:ci-test \
            .

      - name: 🔍 Smoke test Keycloak providers
        if: steps.changed-files.outputs.any_changed == 'true' && matrix.container == 'keycloak'
        run: keycloak/scripts/smoke-test.sh grounds-keycloak:ci-test
