name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  packages: read

jobs:
  docker-build:
    name: 🐳 Build ${{ matrix.container }}
    runs-on: arc-dind
    strategy:
      fail-fast: false
      matrix:
        container:
          - dev-container-node
          - velocity
          - paper
          - paper-gamemode
          - keycloak
          - sentry
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Detect changes
        uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files: |
            ${{ matrix.container }}/**
      - name: 🐳 Set up Docker Buildx
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: 🔨 Build Docker image
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.container }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.event.repository.updated_at }}
            VCS_REVISION=${{ github.sha }}
            IMAGE_VERSION=ci-test
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
