name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  paper-start-test:
    name: Paper start scripts
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: Test Paper startup modes
        run: scripts/test-paper-start.sh

  docker-build:
    name: 🐳 Build ${{ matrix.container }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        container:
          - dev-container-node
          - velocity
          - paper
          - paper-gamemode
          - keycloak
          - geyser
          - plugin-floodgate
          - buildserver
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Detect changes
        uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files: |
            ${{ matrix.container }}/**
            ${{ matrix.container == 'buildserver' && 'scripts/test-buildserver-scene-editor-pin.sh' || '' }}
      - name: 🐳 Set up Docker Buildx
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: 🔨 Build Docker image
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.container }}/Dockerfile
          push: false
          load: ${{ matrix.container == 'buildserver' }}
          tags: ${{ matrix.container == 'buildserver' && 'grounds-buildserver:ci-test' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ matrix.container == 'buildserver' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.event.repository.updated_at }}
            VCS_REVISION=${{ github.sha }}
            IMAGE_VERSION=ci-test
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Smoke test buildserver Scene Editor pin
        if: steps.changed-files.outputs.any_changed == 'true' && matrix.container == 'buildserver'
        run: scripts/test-buildserver-scene-editor-pin.sh grounds-buildserver:ci-test

      - name: 🔨 Build Keycloak smoke-test image
        if: steps.changed-files.outputs.any_changed == 'true' && matrix.container == 'keycloak'
        run: |
          docker buildx build \
            --file keycloak/Dockerfile \
            --load \
            --platform linux/amd64 \
            --tag grounds-keycloak:ci-test \
            .

      - name: 🔍 Smoke test Keycloak providers
        if: steps.changed-files.outputs.any_changed == 'true' && matrix.container == 'keycloak'
        run: keycloak/scripts/smoke-test.sh grounds-keycloak:ci-test
