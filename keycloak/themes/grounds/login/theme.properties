parent=keycloak.v2
import=common/keycloak

# Keep the parent stylesheet first: forms, OTP, recovery and WebAuthn stay native.
styles=css/styles.css css/hub-tokens.css css/hub-components.css css/grounds.css
darkMode=true
favicons.icon=img/grounds-icon.png
favicons.icon.type=image/png

# The Hub remains dark regardless of operating-system preference.
kcHtmlClass=login-pf pf-v5-theme-dark
kcDarkModeClass=grounds-system-dark

# Shared Hub presentation on native, upstream-owned Keycloak controls.
kcButtonPrimaryClass=pf-v5-c-button pf-m-primary btn btn-gold
kcButtonSecondaryClass=pf-v5-c-button pf-m-secondary btn btn-ghost
kcInputClass=pf-v5-c-form-control field
